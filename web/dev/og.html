<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wakeless link card</title>
  <!--
    Renders the link card (og:image) from the landing page's own water scene,
    fonts and colours. Not shipped: scripts/build-site.mjs skips web/dev/.
    Re-render: npm run web, open /web/dev/og.html at device scale 2, wait for
    body[data-ready], capture #og (1200 x 630) as PNG to web/assets/og.png.
  -->
  <link rel="stylesheet" href="/web/fonts.css">
  <style>
    :root { --bg: #07090c; --ink: #edf2f7; --ink-2: #b3becb; --muted: #7b8795; --quiet: #5ee0c1; --line-2: rgba(226, 236, 245, 0.13); }
    body { margin: 0; padding: 40px; background: #000; display: grid; gap: 40px; justify-content: start; }
    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(1100px 520px at 72% -12%, rgba(94, 224, 193, 0.09), transparent 62%), var(--bg);
      color: var(--ink);
      font-family: "Geist", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .og canvas { position: absolute; top: 0; bottom: 0; width: 50%; height: 100%; }
    .og .half.l { left: 0; }
    .og .half.r { right: 0; }
    .og .divider { position: absolute; left: 50%; bottom: 0; height: 31%; width: 1px; background: linear-gradient(180deg, transparent, var(--line-2)); }
    .copy { position: absolute; left: 72px; top: 54px; right: 72px; }
    .lockup { display: flex; align-items: center; gap: 14px; }
    .lockup svg { width: 40px; height: 40px; }
    .lockup span { font: 400 36px/1 "Instrument Serif", Georgia, serif; }
    .eyebrow { margin: 38px 0 0; color: var(--muted); font: 500 17px/1 "Geist Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 18px 0 0; font: 400 112px/0.9 "Instrument Serif", Georgia, serif; letter-spacing: -0.025em; }
    h1 em { color: var(--quiet); font-style: italic; text-shadow: 0 0 48px rgba(94, 224, 193, 0.28); }
    .sub { margin: 22px 0 0; color: var(--ink-2); font-size: 25px; line-height: 1.35; letter-spacing: -0.005em; }
  </style>
</head>
<body>
  <template id="copy">
    <div class="copy">
      <div class="lockup">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0d1318" stroke="rgba(226,236,245,0.13)"/>
          <rect x="7" y="9" width="3" height="11" rx="1.5" fill="#5ee0c1"/>
          <rect x="14.5" y="13" width="3" height="7" rx="1.5" fill="#5ee0c1"/>
          <rect x="22" y="7" width="3" height="13" rx="1.5" fill="#5ee0c1"/>
          <rect x="6" y="24" width="20" height="2" rx="1" fill="#edf2f7" opacity="0.55"/>
        </svg>
        <span>Wakeless</span>
      </div>
      <p class="eyebrow">Private order execution / NEAR Intents</p>
      <h1>Big trades.<br><em>No wake.</em></h1>
      <p class="sub">A large cross-chain swap, worked as random confidential slices.</p>
    </div>
  </template>

  <!-- Left: the moment one swap of the whole order crosses and leaves its wake.
       Right: the same order as 16 slices crossing flat water. -->
  <div class="og" id="og"><canvas class="half l" data-at="16.5"></canvas><canvas class="half r" data-at="40"></canvas><i class="divider"></i></div>

  <script type="module">
    import { startWater } from '/web/water.mjs';
    const copy = document.querySelector('#copy');
    for (const card of document.querySelectorAll('.og')) card.append(copy.content.cloneNode(true));
    await document.fonts.ready;
    for (const canvas of document.querySelectorAll('.og canvas')) {
      startWater(canvas, { band: 0.31, at: Number(canvas.dataset.at), labelSize: 22, scale: 1.35 });
    }
    requestAnimationFrame(() => requestAnimationFrame(() => { document.body.dataset.ready = '1'; }));
  </script>
</body>
</html>
