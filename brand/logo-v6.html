<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wakeless logo v6: the w</title>
<!-- Open through the dev server (npm run web): /brand/logo-v6.html. Whale, iceberg and sliced coin
     were dropped (see brand/BRAND.md); these are the typographic marks. -->
<link rel="stylesheet" href="/web/fonts.css">
<style>
  :root { --bg: #07090c; --panel: #0c1117; --line: rgba(226, 236, 245, 0.13); --ink: #edf2f7; --muted: #7b8795; --mint: #5ee0c1; --paper: #f3f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; width: 1240px; background: var(--bg); color: var(--ink); font: 400 14px/1.5 "Geist", system-ui, sans-serif; }
  h1 { font: 400 30px/1 "Instrument Serif", serif; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; padding: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin-bottom: 12px; }
  .row h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .row p { margin: 0; color: var(--muted); max-width: 78ch; font-size: 13px; }
  .sizes { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #161d25; font-size: 13px; }
  .chip.light { background: var(--paper); color: #0b0f14; }
  .on-light { background: var(--paper); border-radius: 10px; padding: 6px; display: inline-flex; --mint: #1f9c82; --ink: #0b0f14; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #0a0d11; border: 1px solid var(--line); }
  .lockup span { font: 400 27px/1 "Instrument Serif", serif; letter-spacing: -0.01em; }
  .pix { display: inline-flex; gap: 8px; align-items: center; padding: 4px; background: var(--bg); }
  .m { fill: var(--mint); }
  .i { fill: var(--ink); }
  .ms { stroke: var(--mint); fill: none; }
  .tile-bg { fill: #0d1318; stroke: rgba(226, 236, 245, 0.13); }
  .disc-bg { fill: #0d1318; }
  .w { font-family: "Instrument Serif", serif; font-style: italic; }
</style>
</head>
<body>
<h1>Wakeless logo v6: the w</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tile" viewBox="0 0 64 64"><rect class="tile-bg" x="0.5" y="0.5" width="63" height="63" rx="14.5"/></symbol>
    <symbol id="disc" viewBox="0 0 64 64"><circle class="disc-bg" cx="32" cy="32" r="32"/></symbol>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadem" maskUnits="userSpaceOnUse" x="0" y="40" width="64" height="20"><rect x="0" y="40" width="64" height="20" fill="url(#fade)"/></mask>

    <!-- D1. The italic w on a flat line (v3). -->
    <symbol id="d1" viewBox="0 0 64 64">
      <text class="m w" x="32" y="41" text-anchor="middle" font-size="60">w</text>
      <rect class="i" x="9" y="45.2" width="46" height="2" rx="1" opacity="0.55"/>
    </symbol>
    <!-- D2. Larger w, a short reflection that fades: water this still mirrors it. -->
    <symbol id="d2" viewBox="0 0 64 64">
      <text class="m w" x="32" y="40" text-anchor="middle" font-size="66">w</text>
      <rect class="i" x="8" y="41.6" width="48" height="1.6" rx="0.8" opacity="0.55"/>
      <g mask="url(#fadem)"><text class="m w" x="32" y="40" text-anchor="middle" font-size="66" opacity="0.32" transform="translate(0 84.8) scale(1 -1)">w</text></g>
    </symbol>
    <!-- D3. The w alone, large. -->
    <symbol id="d3" viewBox="0 0 64 64">
      <text class="m w" x="32" y="45" text-anchor="middle" font-size="76">w</text>
    </symbol>
    <!-- D4. The w with the surface in mint, as wide as the letter. -->
    <symbol id="d4" viewBox="0 0 64 64">
      <text class="m w" x="32" y="41.5" text-anchor="middle" font-size="68">w</text>
      <rect class="m" x="10.5" y="44.2" width="43" height="2.4" rx="1.2" opacity="0.5"/>
    </symbol>
    <!-- E. Geometric W, cut at its joints (two wakes that cannot run on). -->
    <symbol id="e" viewBox="0 0 64 64"><g id="eg"></g></symbol>
  </defs>
</svg>

<div id="rows"></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const f = (n) => Number(n.toFixed(2));
  {
    const g = document.querySelector('#eg');
    const P = [[10, 15], [21.5, 49], [32, 24], [42.5, 49], [54, 15]];
    for (let k = 0; k < 4; k++) {
      const [ax, ay] = P[k], [bx, by] = P[k + 1];
      const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len;
      const s = k === 0 ? 0 : 4.6, e = k === 3 ? 0 : 4.6;
      const l = document.createElementNS(NS, 'line');
      for (const [a, v] of Object.entries({ class: 'ms', 'stroke-width': 7, 'stroke-linecap': 'round', x1: f(ax + ux * s), y1: f(ay + uy * s), x2: f(bx - ux * e), y2: f(by - uy * e) })) l.setAttribute(a, v);
      g.append(l);
    }
  }
  const CONCEPTS = [
    ['d1', 'D1 · w on a flat line', 'v3 version.'],
    ['d2', 'D2 · w, reflected', 'Larger w; a short reflection that fades out. Only still water gives a clean reflection.'],
    ['d3', 'D3 · w alone', 'The italic w of "wake", nothing else.'],
    ['d4', 'D4 · w on a mint surface', 'The surface in mint, as wide as the letter.'],
    ['e', 'E · Geometric W, cut', 'A W is two wakes; cut at the joints they cannot run on.'],
  ];
  const icon = (id, px, bg = 'tile') => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${bg}"/><use href="#${id}"/></svg>`;
  const mark = (id, px) => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
  document.querySelector('#rows').innerHTML = CONCEPTS.map(([id, name, text]) => `
    <div class="row" id="row-${id}">
      ${icon(id, 170)}
      <div><h2>${name}</h2><p>${text}</p>
        <div class="sizes">
          <span class="chip">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="chip light">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="pix" data-pix="${id}">${icon(id, 48)}${icon(id, 32)}${icon(id, 16)}</span>
          <span class="on-light">${mark(id, 48)}</span>
          <span class="lockup">${icon(id, 26)}<span>Wakeless</span></span>
        </div>
      </div>
    </div>`).join('');
  document.fonts.ready.then(() => requestAnimationFrame(() => { document.body.dataset.ready = '1'; }));
</script>
</body>
</html>
