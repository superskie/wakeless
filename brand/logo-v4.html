<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wakeless logo v4: the whale, sharpened</title>
<!-- Open through the dev server (npm run web): /brand/logo-v4.html. The short stock of v3 read as a
     sprout at 16 px; these variants push the whale features (drooping tips, notch, tapered stock). -->
<link rel="stylesheet" href="/web/fonts.css">
<style>
  :root { --bg: #07090c; --panel: #0c1117; --line: rgba(226, 236, 245, 0.13); --ink: #edf2f7; --muted: #7b8795; --mint: #5ee0c1; --paper: #f3f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; width: 1240px; background: var(--bg); color: var(--ink); font: 400 14px/1.5 "Geist", system-ui, sans-serif; }
  h1 { font: 400 30px/1 "Instrument Serif", serif; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; padding: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin-bottom: 12px; }
  .row h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .row p { margin: 0; color: var(--muted); max-width: 78ch; font-size: 13px; }
  .sizes { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #161d25; font-size: 13px; }
  .chip.light { background: var(--paper); color: #0b0f14; }
  .on-light { background: var(--paper); border-radius: 10px; padding: 6px; display: inline-flex; --mint: #1f9c82; --ink: #0b0f14; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #0a0d11; border: 1px solid var(--line); }
  .lockup span { font: 400 27px/1 "Instrument Serif", serif; letter-spacing: -0.01em; }
  .pix { display: inline-flex; gap: 8px; align-items: center; padding: 4px; background: var(--bg); }
  .m { fill: var(--mint); }
  .i { fill: var(--ink); }
  .tile-bg { fill: #0d1318; stroke: rgba(226, 236, 245, 0.13); }
  .disc-bg { fill: #0d1318; }
</style>
</head>
<body>
<h1>Wakeless logo v4: the whale, sharpened</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tile" viewBox="0 0 64 64"><rect class="tile-bg" x="0.5" y="0.5" width="63" height="63" rx="14.5"/></symbol>
    <symbol id="disc" viewBox="0 0 64 64"><circle class="disc-bg" cx="32" cy="32" r="32"/></symbol>
    <clipPath id="tileclip"><rect x="0.5" y="0.5" width="63" height="63" rx="14.5"/></clipPath>

    <!-- v2 fluke, long stock (reference). -->
    <path id="f2" d="M28.4 50C28.9 45.5 29.4 41.5 29.8 38.6C25.5 37.6 14.5 33.8 8.2 20.2C15.6 19.9 24.4 22.1 30.3 27.2L32 29.4L33.7 27.2C39.6 22.1 48.4 19.9 55.8 20.2C49.5 33.8 38.5 37.6 34.2 38.6C34.6 41.5 35.1 45.5 35.6 50Z"/>
    <!-- New fluke: tips that droop, a deeper notch, a stock that widens into the water. -->
    <path id="f4" d="M27.9 46.6C28.6 43 29.1 39.8 29.4 37.2C22.5 35.8 12.5 31.5 6.4 22.8C7.6 21 9.6 19.8 12.5 19.6C19 19.2 25.5 22.6 30.2 27.6L32 30.2L33.8 27.6C38.5 22.6 45 19.2 51.5 19.6C54.4 19.8 56.4 21 57.6 22.8C51.5 31.5 41.5 35.8 34.6 37.2C34.9 39.8 35.4 43 36.1 46.6Z"/>

    <symbol id="a2" viewBox="0 0 64 64">
      <use href="#f2" class="m"/>
      <rect class="i" x="7" y="49.2" width="50" height="2" rx="1" opacity="0.55"/>
    </symbol>
    <symbol id="a4" viewBox="0 0 64 64">
      <use href="#f4" class="m"/>
      <rect class="i" x="5" y="45.6" width="54" height="1.8" rx="0.9" opacity="0.55"/>
    </symbol>
    <!-- a4 plus the body going down under the surface, faint: the work happens out of sight. -->
    <symbol id="a5" viewBox="0 0 64 64">
      <path class="m" opacity="0.2" d="M28.1 47.4C27.7 51 26.7 54.6 25 58H39C37.3 54.6 36.3 51 35.9 47.4Z"/>
      <use href="#f4" class="m"/>
      <rect class="i" x="5" y="45.6" width="54" height="1.8" rx="0.9" opacity="0.55"/>
    </symbol>
    <!-- a4 with the sea as a faint plane under the horizon (tile only). -->
    <symbol id="a6" viewBox="0 0 64 64">
      <g clip-path="url(#tileclip)"><rect class="m" x="0" y="46.5" width="64" height="18" opacity="0.08"/></g>
      <use href="#f4" class="m"/>
      <rect class="i" x="0.5" y="45.6" width="63" height="1.8" opacity="0.55"/>
    </symbol>
  </defs>
</svg>

<div id="rows"></div>

<script>
  const CONCEPTS = [
    ['a2', 'A2 · v2 tail (reference)', 'Long stock, straight tips.'],
    ['a4', 'A4 · Sharpened tail', 'Tips that droop, a deeper notch, a stock that widens into the water; the surface runs nearly the width of the tile.'],
    ['a5', 'A5 · Tail, body under the surface', 'A4 plus the body going down under the surface, faint: the work happens out of sight (confidential).'],
    ['a6', 'A6 · Tail at sea', 'A4 with the sea as a faint plane under a full-width horizon.'],
  ];
  const icon = (id, px, bg = 'tile') => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${bg}"/><use href="#${id}"/></svg>`;
  const mark = (id, px) => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
  document.querySelector('#rows').innerHTML = CONCEPTS.map(([id, name, text]) => `
    <div class="row" id="row-${id}">
      ${icon(id, 170)}
      <div><h2>${name}</h2><p>${text}</p>
        <div class="sizes">
          <span class="chip">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="chip light">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="pix" data-pix="${id}">${icon(id, 48)}${icon(id, 32)}${icon(id, 16)}</span>
          <span class="on-light">${mark(id, 48)}</span>
          <span class="lockup">${icon(id, 26)}<span>Wakeless</span></span>
        </div>
      </div>
    </div>`).join('');
  document.fonts.ready.then(() => requestAnimationFrame(() => { document.body.dataset.ready = '1'; }));
</script>
</body>
</html>
