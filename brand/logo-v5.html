<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wakeless logo v5: iceberg</title>
<!-- Open through the dev server (npm run web): /brand/logo-v5.html. An iceberg order is a large
     order shown to the market one small slice at a time: Wakeless, across chains. -->
<link rel="stylesheet" href="/web/fonts.css">
<style>
  :root { --bg: #07090c; --panel: #0c1117; --line: rgba(226, 236, 245, 0.13); --ink: #edf2f7; --muted: #7b8795; --mint: #5ee0c1; --paper: #f3f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; width: 1240px; background: var(--bg); color: var(--ink); font: 400 14px/1.5 "Geist", system-ui, sans-serif; }
  h1 { font: 400 30px/1 "Instrument Serif", serif; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; padding: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin-bottom: 12px; }
  .row h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .row p { margin: 0; color: var(--muted); max-width: 78ch; font-size: 13px; }
  .sizes { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #161d25; font-size: 13px; }
  .chip.light { background: var(--paper); color: #0b0f14; }
  .on-light { background: var(--paper); border-radius: 10px; padding: 6px; display: inline-flex; --mint: #1f9c82; --ink: #0b0f14; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #0a0d11; border: 1px solid var(--line); }
  .lockup span { font: 400 27px/1 "Instrument Serif", serif; letter-spacing: -0.01em; }
  .pix { display: inline-flex; gap: 8px; align-items: center; padding: 4px; background: var(--bg); }
  .m { fill: var(--mint); }
  .i { fill: var(--ink); }
  .ms { stroke: var(--mint); fill: none; }
  .tile-bg { fill: #0d1318; stroke: rgba(226, 236, 245, 0.13); }
  .disc-bg { fill: #0d1318; }
</style>
</head>
<body>
<h1>Wakeless logo v5: iceberg</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tile" viewBox="0 0 64 64"><rect class="tile-bg" x="0.5" y="0.5" width="63" height="63" rx="14.5"/></symbol>
    <symbol id="disc" viewBox="0 0 64 64"><circle class="disc-bg" cx="32" cy="32" r="32"/></symbol>

    <!-- I1. Tip in mint above flat water; the mass below in two faint facets. -->
    <symbol id="i1" viewBox="0 0 64 64">
      <path class="m" d="M24.5 25.6L29.2 16.4L32.2 19.6L35.8 12.4L41.8 25.6Z"/>
      <path class="m" opacity="0.32" d="M17.2 29.2H33.4L36.2 56.4L24 53L12.6 41.2Z"/>
      <path class="m" opacity="0.17" d="M33.4 29.2H46.8L54 38.4L48.4 50.2L36.2 56.4Z"/>
      <rect class="i" x="6" y="26.6" width="52" height="1.6" rx="0.8" opacity="0.55"/>
    </symbol>

    <!-- I2. The hidden mass drawn the way a technical drawing draws hidden edges: dashed. -->
    <symbol id="i2" viewBox="0 0 64 64">
      <path class="m" d="M24.5 25.6L29.2 16.4L32.2 19.6L35.8 12.4L41.8 25.6Z"/>
      <path class="ms" stroke-width="1.8" stroke-dasharray="3.2 2.6" stroke-linejoin="round" opacity="0.6" d="M17.2 30H46.8L54 38.6L48.4 50.4L36.2 56.6L24 53.2L12.6 41.2Z"/>
      <rect class="i" x="6" y="26.6" width="52" height="1.6" rx="0.8" opacity="0.55"/>
    </symbol>

    <!-- I3. Bolder: a larger tip with one facet, the mass one flat faint shape. -->
    <symbol id="i3" viewBox="0 0 64 64">
      <path class="m" d="M21.5 27L28.6 13.4L32.4 17.8L37.2 9.8L44.8 27Z"/>
      <path class="m" opacity="0.55" d="M32.4 17.8L37.2 9.8L44.8 27H34.6Z"/>
      <path class="m" opacity="0.22" d="M15.2 30.6H49L55.4 40.2L49.6 51.6L35.6 57.6L22.6 54L10.8 42.4Z"/>
      <rect class="i" x="5" y="28" width="54" height="1.6" rx="0.8" opacity="0.55"/>
    </symbol>

    <!-- I4. I3 with the mass split into horizontal slices: the order under the surface, in pieces. -->
    <mask id="i4m" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="0" y="36.4" width="64" height="1.8" fill="#000"/>
      <rect x="0" y="43.2" width="64" height="1.8" fill="#000"/>
      <rect x="0" y="50" width="64" height="1.8" fill="#000"/>
    </mask>
    <symbol id="i4" viewBox="0 0 64 64">
      <path class="m" d="M21.5 27L28.6 13.4L32.4 17.8L37.2 9.8L44.8 27Z"/>
      <path class="m" opacity="0.55" d="M32.4 17.8L37.2 9.8L44.8 27H34.6Z"/>
      <g mask="url(#i4m)"><path class="m" opacity="0.24" d="M15.2 30.6H49L55.4 40.2L49.6 51.6L35.6 57.6L22.6 54L10.8 42.4Z"/></g>
      <rect class="i" x="5" y="28" width="54" height="1.6" rx="0.8" opacity="0.55"/>
    </symbol>

    <!-- C. Sliced order (runner-up so far). -->
    <mask id="cm" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <circle cx="32" cy="32" r="21" fill="#fff"/>
      <rect x="19.4" y="0" width="2.6" height="64" fill="#000"/>
      <rect x="27.9" y="0" width="2.6" height="64" fill="#000"/>
      <rect x="40.4" y="0" width="2.6" height="64" fill="#000"/>
    </mask>
    <symbol id="c" viewBox="0 0 64 64"><rect class="m" width="64" height="64" mask="url(#cm)"/></symbol>

    <!-- A2. Whale (v2 tail), for comparison. -->
    <symbol id="a2" viewBox="0 0 64 64">
      <path class="m" d="M28.4 50C28.9 45.5 29.4 41.5 29.8 38.6C25.5 37.6 14.5 33.8 8.2 20.2C15.6 19.9 24.4 22.1 30.3 27.2L32 29.4L33.7 27.2C39.6 22.1 48.4 19.9 55.8 20.2C49.5 33.8 38.5 37.6 34.2 38.6C34.6 41.5 35.1 45.5 35.6 50Z"/>
      <rect class="i" x="7" y="49.2" width="50" height="2" rx="1" opacity="0.55"/>
    </symbol>
  </defs>
</svg>

<div id="rows"></div>

<script>
  const CONCEPTS = [
    ['i1', 'I1 · Iceberg, faceted', 'Mint tip over flat water; the mass below in two faint facets.'],
    ['i2', 'I2 · Iceberg, hidden lines', 'The mass below drawn dashed, the way a technical drawing shows hidden edges.'],
    ['i3', 'I3 · Iceberg, bold', 'A larger tip with one shaded facet; the mass one faint shape.'],
    ['i4', 'I4 · Iceberg in slices', 'I3 with the hidden mass cut into horizontal slices.'],
    ['c', 'C · Sliced order', 'Runner-up from v3.'],
    ['a2', 'A2 · Whale', 'From v2, for comparison.'],
  ];
  const icon = (id, px, bg = 'tile') => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${bg}"/><use href="#${id}"/></svg>`;
  const mark = (id, px) => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
  document.querySelector('#rows').innerHTML = CONCEPTS.map(([id, name, text]) => `
    <div class="row" id="row-${id}">
      ${icon(id, 170)}
      <div><h2>${name}</h2><p>${text}</p>
        <div class="sizes">
          <span class="chip">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="chip light">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="pix" data-pix="${id}">${icon(id, 48)}${icon(id, 32)}${icon(id, 16)}</span>
          <span class="on-light">${mark(id, 48)}</span>
          <span class="lockup">${icon(id, 26)}<span>Wakeless</span></span>
        </div>
      </div>
    </div>`).join('');
  document.fonts.ready.then(() => requestAnimationFrame(() => { document.body.dataset.ready = '1'; }));
</script>
</body>
</html>
