<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wakeless logo v2: finalists</title>
<!-- Open through the dev server (npm run web): /brand/logo-v2.html. v1 has the first nine directions. -->
<link rel="stylesheet" href="/web/fonts.css">
<style>
  :root { --bg: #07090c; --panel: #0c1117; --line: rgba(226, 236, 245, 0.13); --ink: #edf2f7; --muted: #7b8795; --mint: #5ee0c1; --paper: #f3f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; width: 1240px; background: var(--bg); color: var(--ink); font: 400 14px/1.5 "Geist", system-ui, sans-serif; }
  h1 { font: 400 30px/1 "Instrument Serif", serif; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; padding: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin-bottom: 12px; }
  .row h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .row p { margin: 0; color: var(--muted); max-width: 76ch; font-size: 13px; }
  .sizes { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #161d25; font-size: 13px; }
  .chip.light { background: var(--paper); color: #0b0f14; }
  .on-light { background: var(--paper); border-radius: 10px; padding: 6px; display: inline-flex; --mint: #1f9c82; --ink: #0b0f14; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: #0a0d11; border: 1px solid var(--line); }
  .lockup span { font: 400 27px/1 "Instrument Serif", serif; letter-spacing: -0.01em; }
  .pix { display: inline-flex; gap: 8px; align-items: center; padding: 4px; background: var(--bg); }
  .m { fill: var(--mint); }
  .i { fill: var(--ink); }
  .tile-bg { fill: #0d1318; stroke: rgba(226, 236, 245, 0.13); }
  .disc-bg { fill: #0d1318; }
  .w { font-family: "Instrument Serif", serif; font-style: italic; }
</style>
</head>
<body>
<h1>Wakeless logo v2: finalists</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tile" viewBox="0 0 64 64"><rect class="tile-bg" x="0.5" y="0.5" width="63" height="63" rx="14.5"/></symbol>
    <symbol id="disc" viewBox="0 0 64 64"><circle class="disc-bg" cx="32" cy="32" r="32"/></symbol>

    <!-- One fluke, used by both whale variants: a raised tail with a notch, the stock entering flat water. -->
    <path id="fluke" d="M28.4 50C28.9 45.5 29.4 41.5 29.8 38.6C25.5 37.6 14.5 33.8 8.2 20.2C15.6 19.9 24.4 22.1 30.3 27.2L32 29.4L33.7 27.2C39.6 22.1 48.4 19.9 55.8 20.2C49.5 33.8 38.5 37.6 34.2 38.6C34.6 41.5 35.1 45.5 35.6 50Z"/>

    <!-- A. Whale, no splash: the big trader goes under and the surface stays flat. -->
    <symbol id="a" viewBox="0 0 64 64">
      <use href="#fluke" class="m"/>
      <rect class="i" x="7" y="49.2" width="50" height="2" rx="1" opacity="0.55"/>
    </symbol>

    <!-- B. The same whale cut into slices: the big order, worked in pieces. -->
    <mask id="bm" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="16" y="0" width="2" height="64" fill="#000"/>
      <rect x="23.2" y="0" width="2" height="64" fill="#000"/>
      <rect x="38.8" y="0" width="2" height="64" fill="#000"/>
      <rect x="46" y="0" width="2" height="64" fill="#000"/>
    </mask>
    <symbol id="b" viewBox="0 0 64 64">
      <g mask="url(#bm)"><use href="#fluke" class="m"/></g>
      <rect class="i" x="7" y="49.2" width="50" height="2" rx="1" opacity="0.55"/>
    </symbol>

    <!-- C. Sliced order: one coin, four slices of random width. -->
    <mask id="cm" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <circle cx="32" cy="32" r="21" fill="#fff"/>
      <rect x="19.4" y="0" width="2.6" height="64" fill="#000"/>
      <rect x="27.9" y="0" width="2.6" height="64" fill="#000"/>
      <rect x="40.4" y="0" width="2.6" height="64" fill="#000"/>
    </mask>
    <symbol id="c" viewBox="0 0 64 64"><rect class="m" width="64" height="64" mask="url(#cm)"/></symbol>

    <!-- D. Still w: the italic w of the headline's "wake" on a flat surface. -->
    <symbol id="d" viewBox="0 0 64 64">
      <text class="m w" x="32" y="41" text-anchor="middle" font-size="60">w</text>
      <rect class="i" x="9" y="45.2" width="46" height="2" rx="1" opacity="0.55"/>
    </symbol>

    <!-- Current mark, for comparison. -->
    <symbol id="z" viewBox="0 0 64 64">
      <rect class="m" x="14" y="18" width="6" height="22" rx="3"/>
      <rect class="m" x="29" y="26" width="6" height="14" rx="3"/>
      <rect class="m" x="44" y="14" width="6" height="26" rx="3"/>
      <rect class="i" x="12" y="48" width="40" height="4" rx="2" opacity="0.55"/>
    </symbol>
  </defs>
</svg>

<div id="rows"></div>

<script>
  const CONCEPTS = [
    ['a', 'A · Whale, no splash', 'In crypto a whale is a big trader. Here it goes under and the surface stays flat: big trades, no wake. One silhouette, readable at 16 px.'],
    ['b', 'B · Whale in slices', 'The same tail cut into five slices: the big order, worked in pieces. The cuts show from 32 px up; at 16 px it is the plain tail.'],
    ['c', 'C · Sliced order', 'One order as a coin, cut into four slices of random width. Abstract and quiet; the water is left to the name.'],
    ['d', 'D · Still w', 'The italic w of the headline\'s "wake", standing on a flat surface. Ties the mark to the type, says little about the product.'],
    ['z', 'Current mark (for comparison)', 'Three bars on a line: next to the desk\'s cost chart it reads as a bar chart icon.'],
  ];
  const icon = (id, px, bg = 'tile') => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${bg}"/><use href="#${id}"/></svg>`;
  const mark = (id, px) => `<svg width="${px}" height="${px}" viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
  document.querySelector('#rows').innerHTML = CONCEPTS.map(([id, name, text]) => `
    <div class="row" id="row-${id}">
      ${icon(id, 170)}
      <div><h2>${name}</h2><p>${text}</p>
        <div class="sizes">
          <span class="chip">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="chip light">${icon(id, 28, 'disc')}@wakeless</span>
          <span class="pix" data-pix="${id}">${icon(id, 48)}${icon(id, 32)}${icon(id, 16)}</span>
          <span class="on-light">${mark(id, 48)}</span>
          <span class="lockup">${icon(id, 26)}<span>Wakeless</span></span>
        </div>
      </div>
    </div>`).join('');
  document.fonts.ready.then(() => requestAnimationFrame(() => { document.body.dataset.ready = '1'; }));
</script>
</body>
</html>
